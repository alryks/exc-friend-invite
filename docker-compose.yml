services:
  bot:
    build:
      context: .
      dockerfile: ./src/bot/Dockerfile
    env_file:
      - .env
    ports:
      - "${WEBHOOK_PUBLIC_PORT}:${WEBHOOK_HOST_PORT}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', ${WEBHOOK_HOST_PORT:-8579}), 3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
